<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A timeline showing the two answers for open source in the AI age: in the medium term, depth (super-powered maintainers with taste); in the long term, breadth (caching society's search for what works). Both feed the same conclusion, that open ecosystems out-innovate closed ones."><rect x="0.5" y="0.5" width="759" height="299" rx="14" fill="#ffffff" stroke="#e2e8f0"/><line x1="60" y1="150" x2="694" y2="150" stroke="#cbd5e1" stroke-width="2"/><path d="M694,144 L706,150 L694,156 Z" fill="#cbd5e1"/><text x="60" y="138" font-size="11" fill="#94a3b8" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">now</text><text x="700" y="138" text-anchor="end" font-size="11" fill="#94a3b8" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">time →</text><rect x="60" y="175" width="300" height="92" rx="10" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.5"/><text x="76" y="199" font-size="10.5" font-weight="700" fill="#2563eb" letter-spacing="0.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">MEDIUM TERM · DEPTH</text><text x="76" y="221" font-size="15" font-weight="700" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">The super-powered maintainer</text><text x="76" y="243" font-size="12" fill="#475569" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">One person with taste out-builds a team</text><line x1="210.0" y1="175" x2="210.0" y2="150" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/><circle cx="210.0" cy="150" r="4" fill="#2563eb"/><rect x="400" y="175" width="300" height="92" rx="10" fill="#7c3aed0d" stroke="#7c3aed" stroke-width="1.5"/><text x="416" y="199" font-size="10.5" font-weight="700" fill="#7c3aed" letter-spacing="0.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">LONG TERM · BREADTH</text><text x="416" y="221" font-size="15" font-weight="700" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Caching the search for what works</text><text x="416" y="243" font-size="12" fill="#475569" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Open source compounds autonomous work</text><line x1="550.0" y1="175" x2="550.0" y2="150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/><circle cx="550.0" cy="150" r="4" fill="#7c3aed"/><rect x="60" y="40" width="640" height="52" rx="10" fill="#0f172a"/><text x="380" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Either way: open ecosystems out-innovate closed ones</text><text x="380" y="84" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">as long as the best models stay universally available</text><path d="M210,175 L210,150" stroke="none"/></svg>